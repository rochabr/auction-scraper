# Contract defaults; discover identifiers from the authorized Entra External ID tenant.
schema_version: 1
provider: microsoft_entra_external_id
flow: authorization_code_pkce
pkce_method: S256
client_registration: preregistered
transport: streamable_http
issuer: null
audience: null
discovery_url: null
resource_url: null
allowed_client_ids: []
allowed_redirect_uris: []
scopes:
  read: auctions.read
  analyze: auctions.analyze
token_validation:
  require_access_token: true
  reject_id_tokens: true
  verify_signature: true
  allowed_algorithms: [RS256]
  clock_skew_seconds: 60
  jwks_cache_ttl_seconds: 3600
  refresh_jwks_on_unknown_kid_once: true
  require_issuer_audience_expiry_subject: true
ownership:
  principal_key: [iss, sub]
  enforce_on_analysis_results_status_artifacts: true
  never_trust_user_id_argument: true
mcp:
  protected_resource_metadata: true
  authorization_server_discovery: true
  require_resource_audience_binding: true
  token_passthrough_allowed: false
  client_flow_must_pass_before_release: true
# Null identifiers and empty registrations block authenticated runtime readiness.
# Local offline tests use ephemeral test signing keys only within the isolated test project.
